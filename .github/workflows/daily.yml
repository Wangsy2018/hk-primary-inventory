name: Daily inventory check & deploy dashboard

on:
  schedule:
    # UTC 01:30 ≈ 香港时间 09:30，每天自动运行
    - cron: "30 1 * * *"
  # 改了代码 push 上来就重建网页，省得手动 Run 一次（用 GITHUB_TOKEN 的
  # 机器人提交不会再触发 workflow，不会自我循环）
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt


      # 数据走土地注册处的 JSON 接口，正常路径用不到浏览器；
      # 这一步只为 JSON 通道失效时的 Selenium 回退保底
      - name: Install Chrome (fallback only)
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: pip install -r requirements.txt


      - name: Run pipeline and notify on change
        id: run
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SEND_EMAIL_IF_NO_CHANGE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "=== git commit ==="
          git rev-parse HEAD
          python run_daily.py
          if [ -f .baseline_updated ]; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "### 数据有更新 ✅" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 数据无变化" >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo ""
            echo "最新一期："
            echo '```'
            tail -n 5 out_inventory/instant_saleable_inventory_monthly.csv
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 无条件跑：待批预售楼花没有历史源，逐月累积的 data/history/ 必须落盘，
      # 否则过了这个月这一格就永远补不回来了
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "data/ 无变化，跳过提交"
          else
            git commit -m "chore: update inventory baseline and pending-presale history"
            git push
          fi

      - name: Bundle dashboard for GitHub Pages
        run: |
          if [ ! -f out_inventory/dashboard.html ]; then
            echo "dashboard.html 未生成，中止发布以保留线上现有页面" >&2
            exit 1
          fi
          mkdir -p pages_build/assets
          cp out_inventory/dashboard.html pages_build/index.html
          if [ -f out_inventory/assets/echarts.min.js ]; then
            cp out_inventory/assets/echarts.min.js pages_build/assets/echarts.min.js
          fi
          echo "=== pages_build contents ==="
          find pages_build -type f

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages_build

  deploy:
    needs: run-and-notify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
